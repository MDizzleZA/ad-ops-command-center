<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Ops Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236C8CFF'/%3E%3Cpath d='M9 22 L16 9 L23 22' stroke='%230F1117' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-name">Ad Ops</div>
          <div class="brand-sub"></div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <span class="muted small">Local command centre</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-group">
          <label class="topbar-label" for="client-switcher">Client</label>
          <select id="client-switcher" class="select"></select>
        </div>
        <div class="topbar-group">
          <label class="topbar-label" for="date-preset">Range</label>
          <select id="date-preset" class="select">
            <option value="7">Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="custom">Custom…</option>
          </select>
          <span id="custom-range" class="custom-range hidden">
            <input type="date" id="date-from" class="input date-input" aria-label="From date">
            <span class="muted">to</span>
            <input type="date" id="date-to" class="input date-input" aria-label="To date">
          </span>
        </div>
        <div class="topbar-spacer"></div>
        <button id="sync-btn" class="btn btn-primary" type="button">
          <svg id="sync-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
          <span id="sync-label">Sync now</span>
        </button>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="/web/vendor/chart.umd.min.js"></script>
  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
